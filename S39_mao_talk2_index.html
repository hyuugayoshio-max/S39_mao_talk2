<!DOCTYPE html>
<!--
【焼肉の女】S39「えつ宅」劇用スマホ（えつ）まおトーク画面
撮影用・単一HTMLファイル（外部読み込みなし）
画面サイズの仕組みは s41「赤奈スマホ 待ち受け〜芝トーク」と同じ
  ・スマホ：画面いっぱい（ホーム画面に追加して全画面表示）
  ・PC：390×844の比率で画面中央に表示
  ・すべての寸法は 画面幅÷390 を1単位として拡大縮小
操作
  ・トーク部分／キー／入力欄を1回触るごとに1文字（変換の確定も1タップ）
  ・送信ボタン（または改行キー）で送信 → キーボードが閉じる
  ・戻るボタン長押し（0.8秒）で最初の入力待ちに戻る
  ・名前「まお」をタップで時計（ステータスバー）の表示／非表示
  ・PC：キーボードの 1＝昨日まで／2＝入力待ち／3＝送信済み
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>トーク</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トーク">
<meta name="application-name" content="トーク">
<meta name="theme-color" content="#9eadd7">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:none}
body.touch{background:#9eadd7}
#phone{position:absolute;overflow:hidden;color:#1c2131;--u:1px;--st:0px;--sb:0px;--g:0px}
/* --g＝iOS 26の全画面表示で描けない画面下の帯の高さ（それ以外の環境では0） */
body.touch #phone{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html.touch,html.touch body{position:static;inset:auto;width:auto;height:auto;margin:0;overflow:visible;touch-action:auto}
#vfix{position:absolute;top:0;left:0;width:1px;height:100vh;height:calc(100vh + env(safe-area-inset-top,0px));visibility:hidden;pointer-events:none}
.scr{position:absolute;inset:0;overflow:hidden}

/* ===== トーク画面 ===== */
#chat{z-index:5;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 60% 22% at 0% 40%,rgba(255,255,255,.30),rgba(255,255,255,0)),radial-gradient(ellipse 55% 20% at 0% 79%,rgba(255,255,255,.26),rgba(255,255,255,0)),#9eadd7}
/* ステータスバー（名前タップで表示／非表示。非表示でも高さは残すので画面はずれない） */
.sbar{flex:none;height:max(var(--st),calc(50*var(--u)));display:flex;align-items:flex-end;justify-content:space-between;padding:0 calc(24*var(--u)) calc(8*var(--u)) calc(38*var(--u));color:#1c2131}
.sbar.hide>*{visibility:hidden}
.sbar .clk{font-size:calc(17*var(--u));font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.sbar .ic{display:flex;gap:calc(6*var(--u));align-items:center}
.sbar .ic svg{display:block;height:calc(12.5*var(--u));width:auto}
.sbar .g4{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-size:calc(15.5*var(--u));font-weight:600;letter-spacing:calc(-.2*var(--u));line-height:1}
.ch{flex:none;padding:0 calc(13*var(--u)) 0 calc(8*var(--u))}
.chi{height:calc(52*var(--u));display:flex;align-items:center}
.cback{width:calc(28*var(--u));height:calc(28*var(--u));border-radius:50%;background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;flex:none}
.cback.down{background:rgba(255,255,255,.75)}
.cback svg{width:calc(14*var(--u));height:calc(14*var(--u));fill:none;stroke:#1c2131;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cname{margin-left:calc(12*var(--u));flex:1;font-size:calc(18*var(--u));font-weight:700;letter-spacing:.02em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname span{display:inline-block;padding:calc(6*var(--u)) calc(14*var(--u)) calc(6*var(--u)) 0}
.cicons{display:flex;gap:calc(18*var(--u))}
.cicons svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:#1c2131;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.c-list{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:calc(4*var(--u)) calc(13*var(--u)) calc(30*var(--u)) calc(7*var(--u));scrollbar-width:none}
.c-list::-webkit-scrollbar{display:none}
.sep{display:flex;justify-content:center;margin-top:calc(18*var(--u))}
.sep span{height:calc(25*var(--u));line-height:calc(25*var(--u));border-radius:calc(12.5*var(--u));background:#7b8ab3;color:#fff;font-size:calc(12*var(--u));font-weight:500;padding:0 calc(12*var(--u))}
.row{display:flex;margin-top:calc(16*var(--u))}
.row.s{justify-content:flex-end}
.av{flex:none;width:calc(36*var(--u));height:calc(36*var(--u));border-radius:50%;margin-right:calc(13*var(--u));background-size:cover;background-position:center;align-self:flex-start}
.ln2{display:flex;align-items:flex-end;min-width:0;max-width:100%}
.row.s .ln2{justify-content:flex-end}
.row.o .ln2{max-width:calc(100% - calc(95*var(--u)))}
.row.s .ln2{max-width:calc(100% - calc(46*var(--u)))}
.bub{position:relative;padding:calc(10*var(--u)) calc(14*var(--u)) calc(11*var(--u));font-size:calc(15.5*var(--u));line-height:1.46;letter-spacing:.02em;box-shadow:0 .5px 1px rgba(28,33,49,.04);min-width:0;flex:0 1 auto;overflow-wrap:anywhere}
.row.o .bub{background:#fff;border-radius:calc(18*var(--u)) calc(22*var(--u)) calc(22*var(--u)) calc(22*var(--u));}
.row.s .bub{background:#cceb95;border-radius:calc(22*var(--u)) calc(18*var(--u)) calc(22*var(--u)) calc(22*var(--u));}
.bub .tail{position:absolute;top:0;width:calc(16*var(--u));height:calc(18*var(--u))}
.row.o .tail{left:calc(-5*var(--u));fill:#fff}
.row.s .tail{right:calc(-5*var(--u));fill:#cceb95;transform:scaleX(-1)}
.tmw{flex:none;display:flex;flex-direction:column;align-items:flex-end;margin-right:calc(7*var(--u))}
.row.o .tmw{align-items:flex-start;margin-right:0;margin-left:calc(7*var(--u))}
.tmw span{display:block;font-size:calc(11.5*var(--u));line-height:1.2;color:#45506b;margin-bottom:calc(2*var(--u));white-space:nowrap}
.row.new{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(calc(8*var(--u)))}to{opacity:1;transform:none}}

/* 入力欄 */
.cin{flex:none;background:#fff;padding:calc(9*var(--u)) calc(12*var(--u)) max(calc(8*var(--u)),calc(max(calc(26*var(--u)),var(--sb)) - var(--g))) calc(14*var(--u));display:flex;align-items:center;gap:calc(16*var(--u))}
#phone.kb .cin{padding-bottom:calc(9*var(--u))}
.cin svg{width:calc(23*var(--u));height:calc(23*var(--u));fill:none;stroke:#23262f;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.lefts{display:flex;gap:calc(16*var(--u));align-items:center}
.cin .collapse{display:none}
.cin.has .lefts{display:none}
.cin.has .collapse{display:block}
.cbox{flex:1;min-width:0;min-height:calc(38*var(--u));border-radius:calc(12*var(--u));background:#f3f4f6;border:1px solid #e6e8ec;display:flex;align-items:center;justify-content:space-between;padding:0 calc(8*var(--u)) 0 calc(12*var(--u));font-size:calc(15*var(--u));color:#a9adb5}
.cbox svg{width:calc(22*var(--u));height:calc(22*var(--u))}
#ftext{flex:1;min-width:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
#ftext .t{color:#1c2131;overflow:hidden}
#ftext .t{line-height:1.5}
#ftext .t u{text-decoration:underline;text-decoration-color:#2f7cf6;text-decoration-thickness:calc(2*var(--u));text-underline-offset:calc(3*var(--u))}
.cur{display:none;width:calc(2*var(--u));height:calc(19*var(--u));background:#2fb24c;margin:0 calc(1*var(--u));flex:none;animation:blink 1s steps(1) infinite}
#phone.kb .cur{display:inline-block;vertical-align:-.18em}
.cin.multi{align-items:flex-end}
.cin.multi>svg,.cin.multi .lefts{margin-bottom:calc(7.5*var(--u))}
.cin.multi .cbox{padding-top:calc(6*var(--u));padding-bottom:calc(6*var(--u))}
.cin.multi .cbox>svg{align-self:flex-end;margin-bottom:calc(2*var(--u))}
@keyframes blink{50%{opacity:0}}
.send{display:none!important}
.cin.has .send{display:block!important}
.cin.has .mic{display:none!important}

/* 画面内キーボード */
#kb{flex:none;display:none;background:#d1d4da;padding:0 calc(4*var(--u)) max(calc(2*var(--u)),calc(calc(var(--sb)*.55) - var(--g)))}
#phone.kb #kb{display:block}
.cand{height:calc(40*var(--u));display:flex;align-items:center;padding:0 calc(10*var(--u)) 0 calc(4*var(--u))}
.cands{flex:1;min-width:0;display:flex;align-items:center;gap:calc(2*var(--u));overflow:hidden;white-space:nowrap}
.cd{font-size:calc(17*var(--u));color:#000;padding:calc(5*var(--u)) calc(11*var(--u));border-radius:calc(6*var(--u))}
.cd+.cd{border-left:1px solid rgba(0,0,0,.08)}
.cd.pressed{background:#8d929c}
.cand>svg{flex:none;width:calc(18*var(--u));height:calc(18*var(--u));fill:none;stroke:#5c6270;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,calc(46*var(--u)));gap:calc(7*var(--u)) calc(6*var(--u));padding:0 calc(2*var(--u))}
.k{border-radius:calc(7*var(--u));background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-size:calc(21*var(--u));color:#000;transition:background .08s}
.k.f{background:#abb0ba;font-size:calc(14*var(--u))}
.k.small{font-size:calc(15*var(--u));letter-spacing:.02em}
.k.pressed{background:#8d929c}
.k.f.pressed{background:#7e838d}
.k svg{width:calc(24*var(--u));height:calc(24*var(--u));fill:none;stroke:#000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.k.enter{grid-column:5;grid-row:3 / span 2}
.kfoot{height:calc(46*var(--u));display:flex;justify-content:space-between;align-items:center;padding:0 calc(22*var(--u))}
.kfoot svg{width:calc(26*var(--u));height:calc(26*var(--u));fill:none;stroke:#3c4150;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="phone">
  <div id="chat" class="scr">
    <div class="sbar" id="sbar">
      <div class="clk" id="clk"></div>
      <div class="ic"></div>   <!-- 電波・4G・電池は表示しない（上の帯の高さだけ残している） -->
    </div>
    <div class="ch"><div class="chi">
      <div class="cback" id="cBack"><svg viewBox="0 0 14 14"><path d="M8.8 2.5 4.3 7l4.5 4.5"/></svg></div>
      <div class="cname"><span id="cName"></span></div>
      <div class="cicons">
        <svg viewBox="0 0 22 22"><circle cx="9.5" cy="9.5" r="6.3"/><path d="M14.2 14.2 19 19"/></svg>
        <svg viewBox="0 0 22 22"><path d="M6 2.8l2.8.5 1.2 3.7-1.9 1.5a11 11 0 0 0 5.4 5.4l1.5-1.9 3.7 1.2.5 2.8a1.9 1.9 0 0 1-2 2C10 17.6 4.4 12 4 4.8a1.9 1.9 0 0 1 2-2z"/></svg>
        <svg viewBox="0 0 22 22"><path d="M3.5 5.5h15M3.5 11h9M3.5 16.5h15"/></svg>
      </div>
    </div></div>

    <div class="c-list" id="list"></div>

    <div class="cin" id="cin">
      <div class="lefts">
        <svg viewBox="0 0 23 23"><rect x="2.5" y="2.5" width="18" height="18" rx="5"/><path d="M11.5 7.3v8.4M7.3 11.5h8.4"/></svg>
        <svg viewBox="0 0 23 23"><rect x="2.2" y="6.5" width="18.6" height="13" rx="3"/><path d="M7.8 6.5l1.6-2.5h4.2l1.6 2.5"/><circle cx="11.5" cy="13" r="3.4"/></svg>
        <svg viewBox="0 0 23 23"><rect x="2.5" y="3.5" width="18" height="16" rx="3"/><path d="M2.8 16.5l5.2-5.2 4.3 4.3 2.7-2.7 5.2 5"/><circle cx="15.5" cy="8.3" r="1.8"/></svg>
      </div>
      <svg class="collapse" viewBox="0 0 23 23"><path d="M8.5 4.5l7 7-7 7" style="stroke-width:2.1"/></svg>
      <div class="cbox" id="cbox"><div id="ftext"></div><svg viewBox="0 0 22 22"><path d="M19.5 12.5V11A8.5 8.5 0 1 0 11 19.5h1.5z"/><path d="M12.5 19.5c0-3.9 3.1-7 7-7"/><circle cx="8" cy="9" r=".9" fill="#23262f"/><circle cx="13.5" cy="9" r=".9" fill="#23262f"/><path d="M7.6 13.2c.9 1.1 2.1 1.6 3.4 1.6"/></svg></div>
      <svg class="mic" viewBox="0 0 23 23"><path d="M3.5 9.5v4M7.5 7v9M11.5 4v15M15.5 7v9M19.5 9.5v4"/></svg>
      <svg class="send" id="send" viewBox="0 0 23 23"><path d="M2.8 10.8 20.2 3.2l-6 17-3.2-7.1z"/><path d="m20.2 3.2-9.2 9.9"/></svg>
    </div>

    <div id="kb">
      <div class="cand"><div class="cands" id="cands"></div><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></div>
      <div class="kgrid">
        <div class="k f" data-k="arrow"><svg viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5"/></svg></div>
        <div class="k" data-k="あ">あ</div>
        <div class="k" data-k="か">か</div>
        <div class="k" data-k="さ">さ</div>
        <div class="k f" data-k="del" data-act="del"><svg viewBox="0 0 24 24"><path d="M8.5 5H20a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H8.5L2.5 12z"/><path d="m11 9 6 6M17 9l-6 6"/></svg></div>
        <div class="k f" data-k="undo"><svg viewBox="0 0 24 24"><path d="M9 6 4.5 10.5 9 15"/><path d="M4.5 10.5H15a5 5 0 0 1 0 10h-3"/></svg></div>
        <div class="k" data-k="た">た</div>
        <div class="k" data-k="な">な</div>
        <div class="k" data-k="は">は</div>
        <div class="k f" data-k="space">空白</div>
        <div class="k f" data-k="abc">ABC</div>
        <div class="k" data-k="ま">ま</div>
        <div class="k" data-k="や">や</div>
        <div class="k" data-k="ら">ら</div>
        <div class="k f enter" data-k="enter" data-act="send">改行</div>
        <div class="k f" data-k="face"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9.3 9.6v.6M14.7 9.6v.6" style="stroke-width:2.2"/></svg></div>
        <div class="k small" data-k="daku">゛゜小</div>
        <div class="k" data-k="わ">わ</div>
        <div class="k small" data-k="punct">、。?!</div>
      </div>
      <div class="kfoot">
        <svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="9.5"/><path d="M3.5 13h19M13 3.5c-3.2 3-3.2 16 0 19M13 3.5c3.2 3 3.2 16 0 19"/></svg>
        <svg viewBox="0 0 26 26"><rect x="9.5" y="3.5" width="7" height="12" rx="3.5"/><path d="M6 12.5a7 7 0 0 0 14 0M13 19.5V23"/></svg>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 設定 ================= */
const CLOCK = '';               // ステータスバーの時計（空欄＝表示しない。時間設定表どおり出す場合は '23:57'）
const SEND_TIME = '23:57';      // 送った吹き出しの時刻（時間設定表 1028版：#2 S39 えつ宅 2026/10/29(木) 23:57）
const PARTNER = 'まお';
/* 送ったメッセージに「既読」を付けるか（true＝付く／false＝付かない）と、付くまでの時間（ミリ秒） */
const READ_AFTER_SEND = false;
const READ_DELAY_MS = 3000;
/* 打ち終わったあと、送信ボタンを押さなくても「どこかを1回タップ」で送信する（true＝する／false＝送信ボタンのみ） */
const AUTO_SEND = true;
/* 吹き出し横の時刻を表示するか（true＝表示／false＝表示しない。時刻のデータは残してあります） */

  {k:'punct', p:'！'},
];
</script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const phone = $('phone'), list = $('list'), cin = $('cin'), ftext = $('ftext'), cands = $('cands'), sbar = $('sbar');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (touch) {
  document.body.classList.add('touch'); document.documentElement.classList.add('touch');
  const vfix = document.createElement('div'); vfix.id = 'vfix'; document.body.appendChild(vfix);
  window.addEventListener('scroll', () => { if (window.scrollY) window.scrollTo(0, 0); }, { passive: true });
}
let W = 390, H = 844, U = 1, GAP = 0;

$('clk').textContent = CLOCK;
$('cName').textContent = PARTNER;

/* ---- トーク ---- */
const TAIL = '<svg class="tail" viewBox="0 0 16 18"><path d="M1.7 2.9Q6.4 4 10.8 4.3L13 6V16H5.5V14.2C5 9.6 3.6 6 1.4 4.1Q.5 3.3 1.7 2.9Z"/></svg>';
let mode = 2;                 // 1＝昨日まで 2＝入力待ち 3＝送信済み
let sentMsg = null;           // 送ったメッセージ
function buildChat(animLast){
  let h = '';
  const groups = LOG.filter(g => !(mode === 1 && g.today));
  groups.forEach((g, gi) => {
    h += `<div class="sep"><span>${esc(g.label)}</span></div>`;
    const msgs = g.msgs.slice();
    if (g.today && sentMsg) msgs.push(sentMsg);
    msgs.forEach(([who, time, text, read], mi) => {
      const isNew = animLast && g.today && mi === msgs.length - 1;
      const bub = `<div class="bub">${TAIL}${String(text).split('／').map(esc).join('<br>')}</div>`;
      if (who === 't') h += `<div class="row o"><div class="av" style="background-image:url('${AVATAR}')"></div><div class="ln2">${bub}<div class="tmw">${SHOW_TIME ? `<span>${esc(time)}</span>` : ''}</div></div></div>`;
      else h += `<div class="row s${isNew ? ' new' : ''}"><div class="ln2"><div class="tmw">${read === false ? '' : '<span>既読</span>'}${SHOW_TIME ? `<span>${esc(time)}</span>` : ''}</div>${bub}</div></div>`;
    });
  });
  list.innerHTML = h;
}
const toBottom = () => { list.scrollTop = list.scrollHeight; requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; }); };

/* ---- サイズ（--u ＝ 画面幅/390 px）※s41と同じ仕組み ---- */
function layout(){
  const iw = window.innerWidth, ih = window.innerHeight;
  let g = 0;
  if (touch) {
    phone.style.width = ''; phone.style.height = '';
    const R = phone.getBoundingClientRect().height;
    W = iw; H = R || ih;
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
    if (standalone && iw <= ih && R) {
      const d = screen.height - R;
      if (d > 8 && d < 120) g = d;
    }
  } else {
    W = Math.min(iw, ih * 390 / 844); H = W * 844 / 390;
    phone.style.width = W + 'px'; phone.style.height = H + 'px';
    phone.style.left = ((iw - W) / 2) + 'px'; phone.style.top = ((ih - H) / 2) + 'px';
  }
  GAP = g; U = W / 390;
  phone.style.setProperty('--u', U + 'px');
  phone.style.setProperty('--g', g + 'px');
  paintGap();
}
function paintGap(){
  let col = '';
  if (touch && GAP > 0) col = phone.classList.contains('kb') ? '#d1d4da' : '#ffffff';
  document.documentElement.style.backgroundColor = col;
  document.body.style.backgroundColor = col;
}

/* ---- 打ち込み（手順を頭から再生して今の状態を作る） ---- */
let step = 0, sent = false, readTimer = null;
function stateAt(n){
  let fixed = '', comp = '', cand = [];
  for (let i = 0; i < n; i++){
    const s = STEPS[i];
    if (s.pick !== undefined){ fixed += cand[s.pick] ?? comp; comp = ''; cand = []; }
    else if (s.p){ fixed += comp + s.p; comp = ''; cand = []; }
    else { comp = s.c; cand = s.cand; }
  }
  return { fixed, comp, cand };
}
const FULL = (() => { const s = stateAt(STEPS.length); return s.fixed + s.comp; })();
function renderInput(){
  const { fixed, comp, cand } = sent ? { fixed:'', comp:'', cand:[] } : stateAt(step);
  if (fixed || comp){
    const br = t => t.split('／').map(esc).join('<br>');
    ftext.innerHTML = `<span class="t">${br(fixed)}${comp ? `<u>${esc(comp)}</u>` : ''}<span class="cur"></span></span>`;
    cin.classList.add('has');
    cin.classList.toggle('multi', fixed.includes('／'));
  } else {
    ftext.innerHTML = `<span class="cur"></span><span>メッセージ</span>`;
    cin.classList.remove('has'); cin.classList.remove('multi');
  }
  cands.innerHTML = cand.map((w, i) => `<div class="cd" data-i="${i}">${esc(w)}</div>`).join('');
}
function flash(el){
  if (!el) return;
  el.classList.add('pressed'); clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('pressed'), 140);
}
const keyEl = k => document.querySelector(`.k[data-k="${k}"]`);
function typeNext(){
  if (sent || mode !== 2) return;
  if (step >= STEPS.length){                              // 打ち終わったあとのタップ＝送信
    if (AUTO_SEND){ flash($('send')); flash(document.querySelector('.k[data-act="send"]')); send(); }
    return;
  }
  const s = STEPS[step];
  if (s.pick !== undefined){
    flash(cands.querySelector(`.cd[data-i="${s.pick}"]`));   // 候補が一瞬光ってから確定
    step++;
    setTimeout(renderInput, 110);
    return;
  }
  flash(keyEl(s.k));
  step++;
  renderInput();
}
function delOne(){ if (sent || mode !== 2 || step <= 0) return; step--; renderInput(); }
function send(){
  if (sent || mode !== 2) return;
  if (step < STEPS.length){ typeNext(); return; }      // 打ち終わる前は1文字進めるだけ
  sentMsg = ['m', SEND_TIME, FULL, false];             // 送った直後は未読
  sent = true;
  phone.classList.remove('kb'); paintGap();
  buildChat(true); renderInput(); toBottom();
  if (READ_AFTER_SEND) readTimer = setTimeout(() => { if (sentMsg){ sentMsg[3] = true; buildChat(); toBottom(); } }, READ_DELAY_MS);
}

/* ---- 状態切り替え（1＝昨日まで／2＝入力待ち／3＝送信済み） ---- */
function setMode(n){
  clearTimeout(readTimer);
  mode = n; step = 0; sent = false; sentMsg = null;
  if (n === 3){ sentMsg = ['m', SEND_TIME, FULL, READ_AFTER_SEND]; sent = true; }
  phone.classList.toggle('kb', n === 2);
  buildChat(); renderInput(); paintGap(); toBottom();
}

/* ---- 操作 ---- */
// キーボード（キー・変換候補）
$('kb').addEventListener('pointerdown', e => {
  e.preventDefault();
  const k = e.target.closest('.k');
  if (k && k.dataset.act === 'del'){ flash(k); delOne(); return; }
  if (k && k.dataset.act === 'send' && step >= STEPS.length){ flash(k); send(); return; }
  typeNext();
});
// 入力欄
cin.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.target.closest('#send')){ send(); return; }
  typeNext();
});
// トーク部分：スクロールではなくタップのときだけ1文字
let tp = null;
list.addEventListener('pointerdown', e => { tp = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() }; });
list.addEventListener('pointerup', e => {
  if (!tp || tp.id !== e.pointerId) return;
  const ok = Math.hypot(e.clientX - tp.x, e.clientY - tp.y) < 10 && Date.now() - tp.t < 600; tp = null;
  if (ok) typeNext();
});
// 名前タップで時計の表示／非表示
$('cName').addEventListener('pointerdown', e => { e.preventDefault(); sbar.classList.toggle('hide'); });
// 戻るボタン長押し（0.8秒）で最初の入力待ちに戻る
const back = $('cBack');
let lp = null;
back.addEventListener('pointerdown', e => { e.stopPropagation(); back.classList.add('down'); lp = setTimeout(() => { back.classList.remove('down'); setMode(2); }, 800); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => back.addEventListener(t, () => { back.classList.remove('down'); clearTimeout(lp); }));
// PC確認用
document.addEventListener('keydown', e => { if (e.key === '1' || e.key === '2' || e.key === '3') setMode(+e.key); });

/* ---- 撮影事故防止 ---- */
const nope = e => e.preventDefault();
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'selectstart', 'contextmenu', 'dragstart'].forEach(t => document.addEventListener(t, nope, { passive: false }));
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('.c-list')) e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ---- 起動 ---- */
setMode(2);
layout(); toBottom();
window.addEventListener('resize', () => { layout(); });
window.addEventListener('orientationchange', () => setTimeout(layout, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
window.addEventListener('pageshow', layout);
[100, 400, 1000].forEach(ms => setTimeout(() => { layout(); toBottom(); }, ms));
})();
</script>
</body>
</html>
